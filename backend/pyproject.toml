[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "retrieva"
version = "0.1.0"
description = "Full-stack RAG application — upload documents, ask questions, get cited answers."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Kaan Ismet" }]
keywords = ["rag", "retrieval-augmented-generation", "embeddings", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/KaanIsmet/Retrieva"
Repository = "https://github.com/KaanIsmet/Retrieva"
Issues = "https://github.com/KaanIsmet/Retrieva/issues"

[tool.uv.scripts]
dev = "uvicorn main:app --app-dir backend/src --reload --host 127.0.0.1 --port 8000"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/retrieva"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend/src"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["retrieva"]
